appId: dev.specflow.desktop
productName: SpecFlow
directories:
  output: release
  buildResources: build/desktop
asar: true
npmRebuild: false
files:
  - dist/desktop/**
  - build/desktop/icon.png
  - package.json
  - '!node_modules/**'
extraResources:
  - from: .tools/desktop/resources
    to: specflow
  # electron-builder skips node_modules at each FileSet root. Map these roots
  # separately so installed services cannot borrow dependencies from the checkout.
  - from: .tools/desktop/resources/node_modules
    to: specflow/node_modules
  - from: .tools/desktop/runtime
    to: runtime
artifactName: SpecFlow-${version}-${os}-${arch}.${ext}
electronUpdaterCompatibility: '>=2.16'
win:
  icon: build/desktop/icon.ico
  extraResources:
    - from: .tools/desktop/runtime/node_modules
      to: runtime/node_modules
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: build/desktop/installer-paths.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  icon: build/desktop/icon.png
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/desktop/entitlements.mac.plist
  entitlementsInherit: build/desktop/entitlements.mac.plist
  notarize: false
dmg:
  title: SpecFlow ${version}
