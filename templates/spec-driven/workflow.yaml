# SpecFlow v0.1 default workflow. Prompts are snapshotted in WorkflowRun.
schemaVersion: 1
id: spec-driven
name: 规格驱动开发
roles: {}
requiredVerification:
  - test
requireReview: true
requireClarification: true
nodes:
  - id: specify
    name: 需求规格
    type: agent
    role: analyst
    prompt: 分析需求和仓库，产出具有验收标准的需求规格。存在未知信息时提出明确问题。
    inputs: []
    outputs:
      - spec
    requireAcceptance: true
  - id: clarify
    name: 需求澄清
    type: clarify
    role: analyst
    prompt: 检查规格的功能边界、异常场景、数据约束和验收标准。仅询问影响设计和验证的关键问题，整个澄清会话最多 5 个问题。读取已有答复，保留需求 ID，把已确认的决策写回完整需求规格。
    inputs:
      - spec
    outputs:
      - spec
  - id: review-spec
    name: 规格复核
    type: review
    role: reviewer
    prompt: 独立检查规格的完整性、歧义和可验证性。
    inputs:
      - spec
    outputs: []
  - id: plan
    name: 工程设计
    type: agent
    role: architect
    prompt: 依据已接纳规格分析现有代码，产出模块、接口、设计决策和风险。
    inputs:
      - spec@accepted
    outputs:
      - plan
    requireAcceptance: true
  - id: review-plan
    name: 设计复核
    type: review
    role: reviewer
    prompt: 独立检查工程设计是否满足需求，定位具体问题。
    inputs:
      - plan
      - spec@accepted
    outputs: []
  - id: tasks
    name: 任务拆解
    type: agent
    role: architect
    prompt: 拆解实现任务。每项任务包含唯一 ID、依赖和验收条件。
    inputs:
      - spec@accepted
      - plan@accepted
    outputs:
      - tasks
    requireAcceptance: true
  - id: review-tasks
    name: 任务复核
    type: review
    role: reviewer
    prompt: 检查任务覆盖、依赖和验收条件。
    inputs:
      - tasks
      - plan@accepted
    outputs: []
  - id: implement
    name: 代码实现
    type: agent
    role: developer
    prompt: 按已接纳任务改动代码，运行相关测试并记录实现说明。
    inputs:
      - spec@accepted
      - plan@accepted
      - tasks@accepted
    outputs:
      - implementation
    taskMode: true
  - id: verify
    name: 测试与检查
    type: verify
    prompt: ""
    inputs:
      - implementation
    outputs: []
  - id: review-code
    name: 代码复核
    type: review
    role: reviewer
    prompt: 独立检查补丁与规格、任务、测试覆盖是否一致。
    inputs:
      - implementation
      - spec@accepted
    outputs: []
  - id: converge
    name: 收敛与对齐
    type: agent
    role: analyst
    prompt: 核对需求、任务、代码与验证证据，产出对齐报告。
    inputs:
      - implementation
      - spec@accepted
      - tasks@accepted
    outputs:
      - convergence
    requireAcceptance: true
  - id: review-converge
    name: 收敛复核
    type: review
    role: reviewer
    prompt: 复核对齐报告，确认没有遗漏需求和证据。
    inputs:
      - convergence
    outputs: []
  - id: accept
    name: 接纳代码
    type: human
    prompt: ""
    inputs:
      - implementation
      - convergence@accepted
    outputs: []
