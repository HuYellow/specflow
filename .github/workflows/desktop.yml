name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version after all native checks pass
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['desktop-v*']
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sourceSha: ${{ steps.plan.outputs.sourceSha }}
      previousTag: ${{ steps.plan.outputs.previousTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Plan immutable version and published changelog baseline
        id: plan
        run: node scripts/desktop-ci.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
  package:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            script: desktop:package:win
            certificate: WIN_CSC_LINK
            certificatePassword: WIN_CSC_KEY_PASSWORD
          - os: macos-15
            platform: mac
            arch: arm64
            script: desktop:package:mac:arm64
            certificate: MAC_CSC_LINK
            certificatePassword: MAC_CSC_KEY_PASSWORD
          - os: macos-15-intel
            platform: mac
            arch: x64
            script: desktop:package:mac:x64
            certificate: MAC_CSC_LINK
            certificatePassword: MAC_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sourceSha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Verify release source and version/tag agreement
        run: node scripts/desktop-release.mjs verify
      - name: Install release signature verifier on macOS
        if: runner.os == 'macOS'
        run: brew list gnupg || brew install gnupg
      - name: Prepare approved Maka release runtime
        run: npm run maka:setup
      - run: npm test
      - name: Build packages
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.certificatePassword] }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.prepare.outputs.publish == 'true' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPECFLOW_REQUIRE_SIGNED_RELEASE: ${{ vars.SPECFLOW_REQUIRE_SIGNED_RELEASE || 'false' }}
      - name: Verify Windows installer directory rules with NSIS
        if: runner.os == 'Windows'
        run: npm run desktop:smoke:installer-directory
      - name: Smoke test packaged desktop
        run: node scripts/toolchain.mjs desktop-smoke --packaged --${{ matrix.arch }}
      - name: Record source commit and actual package signing state
        run: node scripts/desktop-ci.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: SpecFlow-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/desktop-smoke-*.json
            release/desktop-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics when a native check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/desktop-smoke-*.json
            release/desktop-*.png
            release/builder-debug.yml
            .tools/installer-directory-test/summary.json
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sourceSha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          pattern: SpecFlow-*
          path: .tools/desktop-artifacts
      - name: Validate installers and merge both macOS update manifests
        run: node scripts/desktop-release.mjs assemble
      - name: Publish complete GitHub Release
        run: node scripts/desktop-ci.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_SOURCE_SHA: ${{ needs.prepare.outputs.sourceSha }}
          DESKTOP_PREVIOUS_TAG: ${{ needs.prepare.outputs.previousTag }}
      - name: Preserve release notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: .tools/desktop-release-notes.md
          if-no-files-found: ignore
          retention-days: 90
